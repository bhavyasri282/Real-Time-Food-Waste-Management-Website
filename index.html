<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodShare - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <div class="bg-circle c1"></div>
  <div class="bg-circle c2"></div>

  <div class="login-box">
    <div class="logo">🍽</div>
    <div class="title">FoodShare</div>
    <div class="subtitle">Share Food • Spread Hope</div>

    <input type="email" id="email" placeholder="Enter Email" required>
    <input type="password" id="password" placeholder="Enter Password" required>

    <button class="main-btn signin" onclick="signIn()">Sign In</button>
    <button class="main-btn signup" onclick="signUp()">Create Account</button>

    <div class="footer-text" style="margin-top: 15px; font-size: 13px; color: #f5f5f5;">
      Help reduce waste & feed people ❤️
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = "home.html";
    });

    function signUp() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      if (!email || !password) return alert("Please enter both email and password.");

      auth.createUserWithEmailAndPassword(email, password)
        .then(() => alert("Account Created Successfully ✅"))
        .catch(err => alert(err.message));
    }

    function signIn() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      if (!email || !password) return alert("Please enter both email and password.");

      auth.signInWithEmailAndPassword(email, password)
        .then(() => window.location.href = "home.html")
        .catch(err => alert(err.message));
    }
  </script>
</body>
</html>
