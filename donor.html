<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate Food - FoodShare</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="donor-page">

  <nav class="navbar">
    <h3>🍽 FoodShare</h3>
    <div>
      <a href="home.html">Home</a>
      <a href="donor.html">Donate</a>
      <a href="ngo.html">Receive</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <h2>Donate Extra Food</h2>

  <form id="form">
    <input id="name" placeholder="Your Name or Organization" required>
    <input type="tel" id="phone" placeholder="Contact Phone Number (e.g. +91 9876543210)" required>
    <input id="food" placeholder="Food Type (e.g., Rice, 10 Boxed Meals)" required>
    <input id="quantity" placeholder="Quantity (e.g., Feeds ~15 people)" required>
    <input id="address" placeholder="Pickup Address / Landmark">

    <button type="button" class="btn-loc" onclick="getLocation()">Share Live Location 📍</button>
    <p id="locText" style="text-align:center; margin: 6px 0; font-size:14px; font-weight: 500;"></p>

    <button type="submit">Submit Donation ❤️</button>
  </form>

  <div class="card">
    <p><b>Why Donate?</b></p>
    <p>Your surplus meals prevent waste and help feed families, shelters, and communities in need nearby.</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="donor.js"></script>
</body>
</html>
